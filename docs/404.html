<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | XBX 360 Homebrew Store</title>
<meta name="description" content="The page you're looking for doesn't exist.">
<meta name="theme-color" content="#08080a">
<meta name="robots" content="noindex">

<link rel="icon" type="image/svg+xml" href="img/logo.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
    --green:        #92C83E;
    --green-bright: #B4E25C;
    --green-dark:   #107C10;
    --purple:       #A855F7;
    --purple-bright:#C084FC;
    --purple-dark:  #6B21A8;
    --blue:         #1E90FF;
    --blue-bright:  #60A5FA;
    --blue-alt:     #00BFFF;
    --bg-0:         #050506;
    --bg-1:         #08080a;
    --bg-2:         #0e0e12;
    --text:         #f5f5f7;
    --text-dim:     #a1a1aa;
    --text-faint:   #52525b;
    --border:       rgba(255, 255, 255, 0.06);
    --border-hi:    rgba(255, 255, 255, 0.12);
    --glow-green:   rgba(146, 200, 62, 0.45);
    --glow-purple:  rgba(168, 85, 247, 0.45);
    --glow-blue:    rgba(30, 144, 255, 0.45);
    --font-display: 'Orbitron', sans-serif;
    --font-body:    'Inter', sans-serif;
    --font-mono:    'JetBrains Mono', monospace;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body {
    font-family: var(--font-body);
    background: var(--bg-1);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
}

::selection { background: var(--green); color: #000; }

a { color: inherit; text-decoration: none; }

/* ─── Background ─── */
.bg-layer {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
}

.bg-grid {
    position: absolute;
    inset: -10%;
    background-image:
        linear-gradient(rgba(146, 200, 62, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30, 144, 255, 0.045) 1px, transparent 1px);
    background-size: 60px 60px;
    transform: perspective(600px) rotateX(45deg);
    transform-origin: center 20%;
    mask-image: radial-gradient(ellipse at 50% 50%, #000 0%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 50%, #000 0%, transparent 70%);
    animation: gridScroll 20s linear infinite;
}

@keyframes gridScroll {
    from { background-position: 0 0, 0 0; }
    to   { background-position: 0 60px, 60px 0; }
}

.bg-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(140px);
    opacity: 0.4;
    animation: blobFloat 24s ease-in-out infinite;
}

.bg-blob.green  { width: 550px; height: 550px; background: var(--green-dark);  top: -150px; left: -150px; }
.bg-blob.purple { width: 500px; height: 500px; background: var(--purple-dark); top: 30%; right: -180px; animation-delay: -8s; }
.bg-blob.blue   { width: 450px; height: 450px; background: var(--blue);        bottom: -150px; left: 25%; animation-delay: -16s; }

@keyframes blobFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(70px, -50px) scale(1.08); }
    66%      { transform: translate(-50px, 70px) scale(0.94); }
}

.bg-noise {
    position: absolute;
    inset: 0;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    mix-blend-mode: overlay;
}

/* ─── Container ─── */
.wrap {
    position: relative;
    z-index: 2;
    max-width: 720px;
    width: 100%;
    text-align: center;
    animation: fadeIn 1s cubic-bezier(0.22, 1, 0.36, 1) both;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* ─── Big 404 ─── */
.big-code {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: clamp(6rem, 22vw, 13rem);
    line-height: 0.85;
    letter-spacing: -0.04em;
    background: linear-gradient(135deg, var(--green-bright) 0%, var(--blue-bright) 45%, var(--purple-bright) 100%);
    background-size: 220% 220%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradientShift 6s ease infinite;
    filter: drop-shadow(0 0 40px rgba(146, 200, 62, 0.35))
            drop-shadow(0 0 80px rgba(168, 85, 247, 0.25));
    margin-bottom: 8px;
    position: relative;
}

.big-code::after {
    content: '404';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--green-bright), var(--blue-bright), var(--purple-bright));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: glitch 3s steps(2, end) infinite;
    opacity: 0;
}

@keyframes glitch {
    0%, 90%, 100% { opacity: 0; transform: translate(0); }
    92%           { opacity: 0.8; transform: translate(-3px, 2px); }
    94%           { opacity: 0.8; transform: translate(3px, -2px); }
    96%           { opacity: 0.8; transform: translate(-2px, -1px); }
}

@keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
}

/* ─── Error message ─── */
.error-tag {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 3px;
    color: var(--purple-bright);
    text-transform: uppercase;
    padding: 6px 16px;
    border-radius: 999px;
    background: rgba(168, 85, 247, 0.1);
    border: 1px solid rgba(168, 85, 247, 0.3);
    margin-bottom: 20px;
}

.error-title {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(1.4rem, 4vw, 2rem);
    line-height: 1.2;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #fff 0%, var(--text-dim) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}

.error-desc {
    color: var(--text-dim);
    font-size: 1.05rem;
    line-height: 1.7;
    max-width: 480px;
    margin: 0 auto 40px;
}

/* ─── Buttons ─── */
.actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 48px;
}

.btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 30px;
    border-radius: 12px;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.95rem;
    letter-spacing: 0.3px;
    cursor: pointer;
    border: none;
    overflow: hidden;
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                box-shadow 0.35s;
    isolation: isolate;
}

.btn-primary {
    background: linear-gradient(135deg, var(--green-dark) 0%, var(--green) 100%);
    color: #050506;
    box-shadow: 0 0 0 1px rgba(146, 200, 62, 0.5),
                0 10px 30px -8px rgba(146, 200, 62, 0.6);
}

.btn-primary::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.5) 50%, transparent 70%);
    transform: translateX(-100%);
    transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 1;
}

.btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 0 1px rgba(146, 200, 62, 0.8),
                0 20px 40px -10px rgba(146, 200, 62, 0.7),
                0 0 80px -20px rgba(30, 144, 255, 0.5);
}

.btn-primary:hover::after { transform: translateX(100%); }

.btn-secondary {
    background: rgba(255, 255, 255, 0.03);
    color: var(--text);
    border: 1px solid var(--border-hi);
    backdrop-filter: blur(10px);
}

.btn-secondary:hover {
    transform: translateY(-3px);
    border-color: rgba(30, 144, 255, 0.5);
    background: rgba(30, 144, 255, 0.06);
    box-shadow: 0 12px 32px -10px rgba(30, 144, 255, 0.5);
}

/* ─── Helpful links ─── */
.help-links {
    padding: 24px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--border);
    backdrop-filter: blur(10px);
}

.help-label {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 16px;
}

.help-grid {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
}

.help-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--text-dim);
    font-size: 0.9rem;
    font-weight: 500;
    transition: color 0.25s, transform 0.25s;
}

.help-link:hover {
    color: var(--green);
    transform: translateY(-2px);
}

.help-link .arrow {
    transition: transform 0.25s;
}

.help-link:hover .arrow {
    transform: translateX(4px);
}

/* ─── Brand mark at top ─── */
.brand-mark {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 0.95rem;
    letter-spacing: 2px;
    background: linear-gradient(135deg, var(--green), var(--blue), var(--purple));
    background-size: 200% 200%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradientShift 6s ease infinite;
}

@media (max-width: 480px) {
    .help-grid { flex-direction: column; gap: 12px; }
    .actions { flex-direction: column; }
    .btn { width: 100%; justify-content: center; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>
<body>

<div class="bg-layer" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="bg-blob green"></div>
    <div class="bg-blob purple"></div>
    <div class="bg-blob blue"></div>
    <div class="bg-noise"></div>
</div>

<div class="brand-mark">XBX 360 HOMEBREW STORE</div>

<main class="wrap">
    <div class="big-code">404</div>
    <span class="error-tag">Page Not Found</span>
    <h1 class="error-title">This Page Has Been Redacted</h1>
    <p class="error-desc">
        The page you're looking for doesn't exist — or it may have moved somewhere else.
        Let's get you back on track.
    </p>

    <div class="actions">
        <a href="/" class="btn btn-primary">← Back to Home</a>
        <a href="https://github.com/H3X-dev-xbox/xbx-360-homebrew-store" target="_blank" rel="noopener" class="btn btn-secondary">View on GitHub</a>
    </div>

    <div class="help-links">
        <div class="help-label">Maybe you were looking for</div>
        <div class="help-grid">
            <a href="install.html" class="help-link">Install Guide <span class="arrow">→</span></a>
            <a href="downloads.html" class="help-link">Downloads <span class="arrow">→</span></a>
            <a href="faq.html" class="help-link">FAQ <span class="arrow">→</span></a>
            <a href="index.html#roadmap" class="help-link">Roadmap <span class="arrow">→</span></a>
        </div>
    </div>
</main>

</body>
  </html>
